name: app-dev
services:
  postgres:
    restart: always
    image: postgres:18
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready', '-U', '${DB_USER}', '-d', '${DB_DATABASE}']
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 500ms
    volumes:
      - postgres-volume:/var/lib/postgresql
    ports:
      - '127.0.0.1:${DB_PORT}:5432'

  # Catch-all SMTP sink: accepts every message and shows it on
  # http://localhost:8025 instead of delivering it anywhere.
  mailpit:
    restart: always
    image: axllent/mailpit:v1.28
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-volume:
