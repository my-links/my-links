name: my-links
services:
  postgres:
    restart: always
    image: postgres:18
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready', '-U', '${DB_USER}', '-d', '${DB_DATABASE}']
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
      start_interval: 500ms
    volumes:
      - postgres-volume:/var/lib/postgresql
    ports:
      - '127.0.0.1:${DB_PORT}:5432'

  my-links:
    container_name: my-links
    restart: always
    build:
      context: .
      dockerfile: apps/webapp/Dockerfile
      target: production
      args:
        - APP_URL=${APP_URL}
    environment:
      - DB_HOST=postgres
      - HOST=0.0.0.0
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - ${PORT}:3333

  scheduler:
    container_name: my-links-scheduler
    restart: always
    build:
      context: .
      dockerfile: apps/webapp/Dockerfile
      target: production
      args:
        - APP_URL=${APP_URL}
    entrypoint: ['supercronic', '/app/crontab']
    environment:
      - DB_HOST=postgres
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  # Opt-in local relay: `docker compose --profile smtp up`, then point
  # SMTP_HOST at `smtp` and SMTP_PORT at 587. Left out of the default stack on
  # purpose — mail sent straight from a container without SPF, DKIM, DMARC and
  # a matching reverse DNS is rejected by most inboxes, and many hosting
  # providers block outbound port 25 outright. An external SMTP provider
  # configured through the SMTP_* variables is the recommended path.
  smtp:
    profiles: ['smtp']
    restart: always
    image: boky/postfix
    environment:
      - ALLOWED_SENDER_DOMAINS=${SMTP_ALLOWED_SENDER_DOMAINS}
      - RELAYHOST=${SMTP_RELAYHOST:-}
    expose:
      - '587'

volumes:
  postgres-volume:
