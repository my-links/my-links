packages:
  - 'apps/*'

# @adonisjs/inertia type-imports from 'vite' without declaring it as a
# peerDependency, so pnpm falls back to a single shared hoisted 'vite'
# across the whole workspace. Now that apps/extension pulls in a newer
# vite via wxt, that shared fallback can resolve to the wrong major
# version for apps/webapp (pinned to vite ^7). Declaring the peer here
# forces pnpm to build a properly isolated instance per consumer.
packageExtensions:
  '@adonisjs/inertia':
    peerDependencies:
      vite: '*'
  unocss:
    peerDependencies:
      vite: '*'

# argon2 is built with `prebuildify --napi --tag-libc`, so its npm tarball
# already carries the binaries for every platform we ship (glibc and musl,
# x64 and arm64) and `node-gyp-build` picks the right one at require time.
# Running its install script would only rebuild what is already there — and
# would demand a C toolchain inside the Alpine image, which it does not have.
allowBuilds:
  '@swc/core': true
  argon2: false
  esbuild: true
  spawn-sync: true
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
