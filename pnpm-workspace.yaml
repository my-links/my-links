packages:
  - 'apps/*'

minimumReleaseAge: 1440

# Same-day releases of libs maintained by the person who maintains this repo.
# Exact versions only; the age gate still applies to every other release.
minimumReleaseAgeExclude:
  - '@minimalstuff/tooling@0.7.0'
  - '@minimalstuff/ui@3.2.0'

# Both ranges are dev/build-tooling-only transitives (ts-morph via
# @adonisjs/assembler, vite via the extension's build chain), never
# reach the served runtime, but the fix is a same-major patch bump,
# so there is no reason not to take it.
overrides:
  brace-expansion@>=5.0.0 <5.0.12: '>=5.0.12'
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1'
  # Same-major security patches for tooling transitives whose parents pin
  # an older range (oxfmt, release-it, openapi-typescript, vitepress).
  tinypool@<2.1.2: '^2.1.2'
  undici@>=7.0.0 <7.29.1: '^7.29.1'
  js-yaml@>=4.0.0 <4.3.2: '^4.3.2'
  source-map-js@<1.2.2: '^1.2.2'
  # @adonisjs/mail still declares ^9 and every 9.x has open advisories. 10.0
  # only drops Node < 20 and ships a TypeScript rebuild with both ESM and CJS.
  nodemailer: '^10.0.9'
  # 1.5.0 rewrote $ref resolution around the WHATWG URL API, which throws
  # on Node 24 for @adonisjs/ace's command metadata schema, which breaks the
  # first `node ace <command>` of every process. 1.4.1 still uses the
  # legacy `url` module and doesn't hit it. CLI-only, never served.
  jsonschema: '1.4.1'

# @adonisjs/inertia type-imports from 'vite' without declaring it as a
# peerDependency, so pnpm falls back to a single shared hoisted 'vite'
# across the whole workspace. Now that apps/extension pulls in a newer
# vite via wxt, that shared fallback can resolve to the wrong major
# version for apps/webapp (pinned to vite ^7). Declaring the peer here
# forces pnpm to build a properly isolated instance per consumer.
packageExtensions:
  '@adonisjs/inertia':
    peerDependencies:
      vite: '*'
  unocss:
    peerDependencies:
      vite: '*'

# argon2 is built with `prebuildify --napi --tag-libc`, so its npm tarball
# already carries the binaries for every platform we ship (glibc and musl,
# x64 and arm64) and `node-gyp-build` picks the right one at require time.
# Running its install script would only rebuild what is already there, and
# would demand a C toolchain inside the Alpine image, which it does not have.
allowBuilds:
  '@swc/core': true
  argon2: false
  esbuild: true
  spawn-sync: true
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
